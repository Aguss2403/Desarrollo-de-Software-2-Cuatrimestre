<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listado de Productos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard_style.css">
  <link rel="stylesheet" href="product.css">
  <script src="dashboard.js"></script>
  <script src="product.js"></script>
</head>
<body>
  <div class="dashboard-container">
    <header>
      <span>Dashboard</span>
      <div>
        <button class="menu" id="menu-btn">&#9776;</button>
        <button id="logout">Cerrar Sesión</button>
      </div>
    </header>
    <nav id="nav">
      <ul>
        <li><a href="dashboard.html">Productos</a></li>
        <li><a href="product.html">Crear Producto</a></li>
      </ul>
    </nav>
    <main>
      <h1>Crear un Producto</h1>
      
      <form id="product-form">
        <label for="sku">SKU:</label>
        <input type="text" id="sku" name="sku" required>

        <label for="cui">Codigo Unico:</label>
        <input type="text" name="cui" id="cui" required>

        <label for="name">Nombre:</label>
        <input type="text" name="name" id="name" required>

        <label for="description">Descripcion:</label>
        <textarea name="description" id="description"></textarea>

        <label for="price">Precio:</label>
        <input type="number" name="price" id="price" min="0" step="0.01">

        <label for="stock">Stock:</label>
        <input type="number" name="stock" id="stock" min="0">

        <button type="submit">Guardar</button>
      </form>

    </main>
    <footer>Mi Aplicación &copy; 2024</footer>
  </div>
</body>
</html>
